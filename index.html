*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  min-height:100vh;
  background: linear-gradient(135deg, #050a1f, #0b1736, #10122e);
  background-attachment: fixed;
  padding:40px 20px;
}
.container{
  max-width:900px;
  margin:0 auto;
}
.title-main{
  text-align:center;
  color:#ffffff;
  font-size:42px;
  margin:20px 0 16px;
  text-shadow: 0 2px 10px #00000060;
}
.desc-text{
  text-align:center;
  color:#e2e8f0;
  font-size:18px;
  margin-bottom:40px;
  line-height:1.7;
}
h2{
  text-align:center;
  color:#ffffff;
  font-size:32px;
  margin:32px 0 16px;
  text-shadow: 0 2px 10px #00000060;
}
.glass{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  padding:26px;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
}
.tag-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.tag{
  padding:9px 18px;
  background:rgba(255,255,255,0.12);
  border-radius:999px;
  color:#fff;
  font-size:15px;
}
.link-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}
.link-item{
  padding:14px 18px;
  background:rgba(255,255,255,0.10);
  border-radius:14px;
  color:#ffffff;
}
.link-item a{
  color:#f4b8ff;
  text-decoration:none;
}
.link-item a:hover{
  text-decoration: underline;
}

/* 悬浮Tooltip样式 */
.tooltip-wrap{
  position: relative;
}
.tooltip-card{
  position: absolute;
  left: 0;
  top: calc(100% + 12px);
  background: #282259;
  color: #fff;
  padding:18px;
  border-radius:16px;
  width:240px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.44);
  opacity:0;
  visibility:hidden;
  transition: 0.2s ease;
  z-index:99;
}
.tooltip-wrap:hover .tooltip-card{
  opacity:1;
  visibility:visible;
}
.tip-icon{
  font-size:32px;
  margin-bottom:8px;
}
.tip-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:6px;
}
.tip-desc{
  font-size:16px;
  color:#ddd;
  margin-bottom:12px;
}
.tip-btn{
  background:#d6489c;
  text-align:center;
  padding:6px 0;
  border-radius:999px;
  font-size:15px;
}
</style>
