<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>KuguaKing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  min-height:100vh;
  /* 星空深海渐变，深蓝过渡暗紫 */
  background: linear-gradient(135deg, #050a1f, #0b1736, #10122e);
  background-attachment: fixed;
  padding:40px 20px;
}
.container{
  max-width:900px;
  margin:0 auto;
}
h2{
  text-align:center;
  color:#ffffff;
  font-size:32px;
  margin:32px 0 16px;
  text-shadow: 0 2px 10px #00000060;
}
.glass{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  padding:26px;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
}
.tag-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.tag{
  padding:9px 18px;
  background:rgba(255,255,255,0.12);
  border-radius:999px;
  color:#fff;
  font-size:15px;
}
.link-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}
.link-item{
  padding:14px 18px;
  background:rgba(255,255,255,0.10);
  border-radius:14px;
  color:#ffffff;
}
.link-item a{
  color:#f4b8ff;
  text-decoration:none;
}
.link-item a:hover{
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="container">
  <h2>兴趣爱好</h2>
  <div class="glass">
    <div class="tag-row">
      <span class="tag">折腾电脑</span>
      <span class="tag">游戏</span>
      <span class="tag">MC</span>
      <span class="tag">听歌</span>
      <span class="tag">追剧</span>
      <span class="tag">摄影</span>
    </div>
  </div>

    <div class="link-item">Telegram：<a href="https://t.me/Kugua1258" target="_blank">@Kugua1258</a></div>
